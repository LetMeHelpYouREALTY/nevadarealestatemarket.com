name: Cloudflare Images Upload

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "public/images/**"
      - "scripts/upload-to-cloudflare-images.mjs"
      - ".github/workflows/cloudflare-images-upload.yml"

permissions:
  contents: read

jobs:
  upload:
    name: Upload hosted images
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 2cc579c1ec9e426ed585e933ebf4753b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_IMAGES_SKIP_EXISTING: "1"
    steps:
      - name: Skip when Cloudflare Images token is missing
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "CLOUDFLARE_API_TOKEN is not set on this repo."
          echo "Git /public/images remains the live backup."
          echo "Add a token with Account.Cloudflare Images:Edit for account $CLOUDFLARE_ACCOUNT_ID, then re-run this workflow."
          echo "After upload, set NEXT_PUBLIC_CF_IMAGES_HASH=byE6BTe9lNqo21V57n4aPQ on Vercel Production."

      - name: Checkout
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload public/images to Cloudflare Images
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/upload-to-cloudflare-images.mjs
